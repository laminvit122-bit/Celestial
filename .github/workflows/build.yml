name: Build Celestial
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Find project and build
        run: |
          # Ищем папку, где лежит build.gradle, и переходим в неё
          PROJECT_DIR=$(find . -name "build.gradle" -exec dirname {} \; | head -n 1)
          echo "Сборка в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: Client-Jar
          path: "**/build/libs/*.jar"
